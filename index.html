<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BRX STORE</title><style>
body{margin:0;background:#090711;color:#f5f3ff;font:16px system-ui}header{text-align:center;padding:25px;background:#160d27;border-bottom:1px solid #39245a}.logo{font-size:28px;font-weight:900;color:#c4a7ff;letter-spacing:2px}main{max-width:950px;margin:25px auto;padding:0 16px}.notice{background:#211833;padding:12px;border:1px solid #50317a;border-radius:12px;color:#d9c9ff;font-size:13px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin-top:18px}.card{background:#151023;border:1px solid #302044;border-radius:15px;padding:18px}.muted{color:#aaa3bd;font-size:14px}.price{font-size:20px;font-weight:bold;color:#c4a7ff;margin:12px 0}button{background:#8b5cf6;color:white;border:0;padding:10px;border-radius:9px}button:disabled{opacity:.5}footer{text-align:center;color:#aaa3bd;padding:30px}
</style></head><body><header><div class="logo">BRX STORE</div><p class="muted">Digital Key • Fast • Trusted</p></header><main><div class="notice">Katalog Supabase starter. QRIS dan pengiriman key otomatis belum aktif.</div><p id="status" class="muted">Memuat produk…</p><section id="products" class="grid"></section></main><footer>© BRX STORE</footer>
<script>
const SUPABASE_URL="https://YOUR_PROJECT_ID.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="YOUR_SB_PUBLISHABLE_KEY";
const rupiah=n=>new Intl.NumberFormat("id-ID",{style:"currency",currency:"IDR",maximumFractionDigits:0}).format(n);
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
async function load(){let st=document.getElementById("status"),box=document.getElementById("products");
if(SUPABASE_URL.includes("YOUR_PROJECT")||SUPABASE_PUBLISHABLE_KEY.includes("YOUR_SB_")){st.textContent="Isi URL dan Publishable Key Supabase di index.html.";return}
try{let r=await fetch(SUPABASE_URL+"/rest/v1/products?select=id,name,description,price&order=id.desc",{headers:{apikey:SUPABASE_PUBLISHABLE_KEY,Authorization:"Bearer "+SUPABASE_PUBLISHABLE_KEY}});
if(!r.ok)throw Error("HTTP "+r.status+" (cek tabel/RLS policy)");let a=await r.json();st.textContent=a.length?a.length+" produk tersedia":"Belum ada produk";
box.innerHTML=a.map(p=>'<article class="card"><h3>'+esc(p.name)+'</h3><p class="muted">'+esc(p.description||"Digital product")+'</p><div class="price">'+rupiah(p.price||0)+'</div><button disabled>Checkout segera</button></article>').join("");
}catch(e){st.textContent="Gagal memuat: "+e.message}}
load();
</script></body></html>
